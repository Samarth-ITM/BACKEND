<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System - Samarth Navale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 24px 16px; }
    .container { max-width: 1050px; margin: 0 auto; }
    header { background: #ffffff; padding: 20px 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 22px; color: #0f172a; }
    .subtitle { color: #64748b; font-size: 14px; margin-top: 4px; }
    .badge { display: inline-block; padding: 4px 10px; background: #e0e7ff; color: #3730a3; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .card { background: #ffffff; padding: 20px 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
    h2 { font-size: 17px; margin-bottom: 16px; color: #334155; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 500; color: #475569; }
    input, select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: #3b82f6; }
    .btn { background: #2563eb; color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; padding: 4px 10px; font-size: 12px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-info { background: #0284c7; padding: 4px 10px; font-size: 12px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    tr:hover { background: #f8fafc; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; display: none; }
    .msg-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .auth-banner { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Library Management System</h1>
        <div class="subtitle">Assignment 6 • Books, Borrowing, Role-Based Access & Transactions</div>
      </div>
      <div>
        <span class="badge">Samarth Navale (150096725148)</span>
      </div>
    </header>

    <div id="alertMsg" class="msg"></div>

    <div class="card">
      <div class="auth-banner">
        <div id="authStatusText">Status: <strong>Guest (Read Only)</strong></div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="text" id="authEmail" placeholder="Email" style="width: 120px; font-size: 12px; padding: 4px 8px;">
          <input type="password" id="authPass" placeholder="Password" style="width: 100px; font-size: 12px; padding: 4px 8px;">
          <select id="authRole" style="font-size: 12px; padding: 4px 6px;">
            <option value="student">Student</option>
            <option value="librarian">Librarian</option>
          </select>
          <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;" onclick="handleLogin()">Login</button>
          <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;" onclick="handleRegister()">Register</button>
        </div>
      </div>

      <h2>Add New Book (Librarian)</h2>
      <form id="addBookForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="bTitle">Book Title</label>
            <input type="text" id="bTitle" placeholder="e.g. Clean Code" required>
          </div>
          <div class="form-group">
            <label for="bAuthor">Author</label>
            <input type="text" id="bAuthor" placeholder="e.g. Robert C. Martin" required>
          </div>
          <div class="form-group">
            <label for="bIsbn">ISBN</label>
            <input type="text" id="bIsbn" placeholder="e.g. 9780132350884" required>
          </div>
          <div class="form-group">
            <label for="bCategory">Category</label>
            <input type="text" id="bCategory" placeholder="e.g. Computer Science" required>
          </div>
          <div class="form-group">
            <label for="bQty">Quantity</label>
            <input type="number" id="bQty" min="1" value="5" required>
          </div>
        </div>
        <button type="submit" class="btn btn-success">+ Add Book</button>
      </form>
    </div>

    <div class="card">
      <h2>Book Catalog</h2>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by title, author, category..." style="width: 260px;">
        <button class="btn btn-secondary" onclick="loadBooks()">Refresh</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>ISBN</th>
              <th>Quantity / Avail</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookTableBody">
            <tr><td colspan="6" style="text-align: center; color: #64748b;">Loading books...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('lib_token') || '';
    let userRole = localStorage.getItem('lib_role') || '';
    let allBooks = [];

    function updateAuthStatus() {
      const el = document.getElementById('authStatusText');
      if (authToken) {
        el.innerHTML = `Status: <strong style="color: #166534;">Logged In (${userRole || 'User'})</strong> <a href="#" onclick="logout()" style="margin-left: 8px; color: #dc2626; font-size: 12px;">Logout</a>`;
      } else {
        el.innerHTML = 'Status: <strong>Guest (Read Only)</strong>';
      }
    }
    updateAuthStatus();

    function logout() {
      authToken = '';
      userRole = '';
      localStorage.removeItem('lib_token');
      localStorage.removeItem('lib_role');
      updateAuthStatus();
      showAlert('Logged out.');
    }

    function showAlert(text, isError = false) {
      const el = document.getElementById('alertMsg');
      el.textContent = text;
      el.className = isError ? 'msg msg-error' : 'msg msg-success';
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 4000);
    }

    async function handleRegister() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      const role = document.getElementById('authRole').value;
      if (!email || !password) return showAlert('Enter email and password', true);

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name: email.split('@')[0], role })
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Registration successful! Please login.');
        } else {
          showAlert(data.message || 'Registration failed', true);
        }
      } catch (e) { showAlert('Network error', true); }
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPass').value.trim();
      if (!email || !password) return showAlert('Enter email and password', true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          authToken = data.token;
          userRole = data.user ? data.user.role : '';
          localStorage.setItem('lib_token', authToken);
          localStorage.setItem('lib_role', userRole);
          updateAuthStatus();
          showAlert('Logged in successfully!');
        } else {
          showAlert(data.message || 'Login failed', true);
        }
      } catch (e) { showAlert('Network error', true); }
    }

    async function loadBooks() {
      try {
        const res = await fetch('/api/books');
        const json = await res.json();
        allBooks = json.data || (Array.isArray(json) ? json : []);
        renderBooks(allBooks);
      } catch (err) {
        document.getElementById('bookTableBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">Failed to load books.</td></tr>';
      }
    }

    function renderBooks(list) {
      const tbody = document.getElementById('bookTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748b;">No books found.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(b => `
        <tr>
          <td><strong>${escapeHtml(b.title || '')}</strong></td>
          <td>${escapeHtml(b.author || '')}</td>
          <td>${escapeHtml(b.category || '')}</td>
          <td><code>${escapeHtml(b.isbn || '')}</code></td>
          <td>${b.availableQuantity ?? b.quantity ?? 0} / ${b.quantity ?? 0}</td>
          <td>
            <button class="btn btn-info" onclick="borrowBook('${b._id || b.id}')">Borrow</button>
            <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;" onclick="returnBook('${b._id || b.id}')">Return</button>
            <button class="btn btn-danger" onclick="deleteBook('${b._id || b.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allBooks.filter(b => 
        (b.title && b.title.toLowerCase().includes(q)) || 
        (b.author && b.author.toLowerCase().includes(q)) ||
        (b.category && b.category.toLowerCase().includes(q)) ||
        (b.isbn && b.isbn.toLowerCase().includes(q))
      );
      renderBooks(filtered);
    });

    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!authToken) return showAlert('Login as librarian required.', true);

      const payload = {
        title: document.getElementById('bTitle').value.trim(),
        author: document.getElementById('bAuthor').value.trim(),
        isbn: document.getElementById('bIsbn').value.trim(),
        category: document.getElementById('bCategory').value.trim(),
        quantity: Number(document.getElementById('bQty').value)
      };

      try {
        const res = await fetch('/api/books', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Book added successfully!');
          document.getElementById('addBookForm').reset();
          loadBooks();
        } else {
          showAlert(data.message || 'Failed to add book', true);
        }
      } catch (err) { showAlert('Network error', true); }
    });

    async function borrowBook(id) {
      if (!authToken) return showAlert('Login as student required to borrow.', true);
      try {
        const res = await fetch(`/api/books/${id}/borrow`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Book borrowed successfully!');
          loadBooks();
        } else {
          showAlert(data.message || 'Borrow failed', true);
        }
      } catch (e) { showAlert('Network error', true); }
    }

    async function returnBook(id) {
      if (!authToken) return showAlert('Login required to return.', true);
      try {
        const res = await fetch(`/api/books/${id}/return`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Book returned successfully!');
          loadBooks();
        } else {
          showAlert(data.message || 'Return failed', true);
        }
      } catch (e) { showAlert('Network error', true); }
    }

    async function deleteBook(id) {
      if (!authToken) return showAlert('Librarian login required to delete.', true);
      if (!confirm('Are you sure you want to delete this book?')) return;
      try {
        const res = await fetch(`/api/books/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        if (res.ok) {
          showAlert('Book deleted successfully');
          loadBooks();
        } else {
          showAlert(data.message || 'Delete failed', true);
        }
      } catch (e) { showAlert('Network error', true); }
    }

    loadBooks();
  </script>
</body>
</html>
