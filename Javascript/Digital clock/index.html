<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Stopwatch</h1>
    <div id="stopwatch">
        <h2>Stopwatch</h2>
        <p id="result">00:00:00</p>
        <button id="start-stopwatch" onclick="start()">Start</button>
        <button id="stop-stopwatch" onclick="stop()">Stop</button>
        <button id="reset-stopwatch" onclick="reset()">Reset</button>
    </div>
</body>
<script>
    let hours = 0
    let minutes = 0
    let seconds = 0
    let interval;
    var start = false;



    function start() {
        interval = setInterval(() => {
            seconds++;
            if (seconds == 60) {
                seconds = 0;
                minutes++;
                if (minutes == 60) {
                    minutes = 0;
                    hours++;
                }
            }
            document.getElementById('result').textContent = `${String(hours)}:${String(minutes)}:${String(seconds)}`;
        }, 1000)
    }

    function stop() {
        clearInterval(interval);
    }

    function reset() {
        clearInterval(interval);
        hours = 0;
        minutes = 0;
        seconds = 0;
        document.getElementById('result').textContent = `${String(hours)}:${String(minutes)}:${String(seconds)}`;
    }
</script>

</html>
